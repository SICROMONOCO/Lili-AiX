[package]
name = "provider-megaplay"
description = "MegaPlay (AniKoto's player), direct: AniList/MAL-keyed embed, AES-decrypted source, HLS"
version = "1.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = "0.8"
cbc = "0.1"
provider-kit = { path = "../kit" }
serde_json = "1"
wit-bindgen = "0.62"
