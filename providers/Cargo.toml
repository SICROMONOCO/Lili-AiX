# Providers compiled to WebAssembly components (target wasm32-wasip2). A separate workspace, so the
# app's host builds never try to compile them, and so each module can ship on its own.
#
#   cargo build --manifest-path providers/Cargo.toml --target wasm32-wasip2 --release
#   node scripts/build-providers.mjs   (builds and copies to vendor/providers/)

[workspace]
resolver = "3"
# anichan: dormant since 2026-10-04 (its servers API returns `{"servers":[]}` for every title);
# build it explicitly when the site recovers and ship it through the provider channel.
members = ["animeheaven", "animeonsen", "animepahe", "anipm", "anizone", "kit", "megaplay", "rift", "uniquestream", "zoko"]
exclude = ["anichan"]

[workspace.package]
edition = "2024"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
