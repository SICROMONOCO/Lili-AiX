[package]
name = "anilili-mpv"
description = "Thin, owned binding to a dynamically loaded libmpv (client API 2.x)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libloading = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
