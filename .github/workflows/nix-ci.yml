name: "NixOS x86_64 Build & Flake Validation"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix with Flakes enabled
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check Flake Metadata
        run: nix flake metadata

      - name: Flake Check
        run: nix flake check

      - name: Build Application Package (x86_64-linux)
        run: nix build .#packages.x86_64-linux.default --print-build-logs
