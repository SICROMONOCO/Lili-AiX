name: "NixOS x86_64 Build & Flake Validation"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix with Flakes enabled
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check Flake Metadata
        run: nix flake metadata

      - name: Flake Check
        run: nix flake check

      - name: Build Application Package (x86_64-linux)
        run: nix build .#packages.x86_64-linux.default --print-build-logs --out-link result

      - name: Stage package artifact
        run: |
          mkdir -p artifact
          cp -rL result/. artifact/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: anilili-desktop-x86_64-linux
          path: artifact
          if-no-files-found: error
          retention-days: 7
