[package]
name = "anilili-linux-playback-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Keep this experiment outside the production workspace and its native TLS/Wasmtime build.
[workspace]

[target.'cfg(target_os = "linux")'.build-dependencies]
tauri-build = "=3.0.0-alpha.3"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = "=3.0.0-alpha.4"
tauri-runtime-wry = "=3.0.0-alpha.4"
gtk = "=0.18.2"
libloading = "0.8"
serde_json = "1"
anilili-mpv = { path = "../../crates/mpv" }
